  <text x="10" y="160" font-family="monospace" font-size="11" fill="#858585">8</text>
  <text x="10" y="175" font-family="monospace" font-size="11" fill="#858585">9</text>
  <text x="5" y="190" font-family="monospace" font-size="11" fill="#858585">10</text>

  <!-- Code with syntax highlighting -->
  <text x="50" y="55" font-family="monospace" font-size="12" fill="#569cd6">function</text>
  <text x="125" y="55" font-family="monospace" font-size="12" fill="#dcdcaa">validateUser</text>
  <text x="225" y="55" font-family="monospace" font-size="12" fill="#cccccc">(user) {</text>

  <text x="60" y="70" font-family="monospace" font-size="12" fill="#c586c0">if</text>
  <text x="85" y="70" font-family="monospace" font-size="12" fill="#cccccc">(!user.email) {</text>

  <text x="70" y="85" font-family="monospace" font-size="12" fill="#c586c0">return</text>
  <text x="120" y="85" font-family="monospace" font-size="12" fill="#569cd6">false</text>
  <text x="160" y="85" font-family="monospace" font-size="12" fill="#cccccc">;</text>

  <text x="60" y="100" font-family="monospace" font-size="12" fill="#cccccc">}</text>

  <text x="60" y="115" font-family="monospace" font-size="12" fill="#6a9955">// Duplicate code pattern</text>

  <text x="60" y="130" font-family="monospace" font-size="12" fill="#c586c0">if</text>
  <text x="85" y="130" font-family="monospace" font-size="12" fill="#cccccc">(!user.name) {</text>

  <text x="70" y="145" font-family="monospace" font-size="12" fill="#c586c0">return</text>
  <text x="120" y="145" font-family="monospace" font-size="12" fill="#569cd6">false</text>
  <text x="160" y="145" font-family="monospace" font-size="12" fill="#cccccc">;</text>

  <text x="60" y="160" font-family="monospace" font-size="12" fill="#cccccc">}</text>

  <text x="50" y="175" font-family="monospace" font-size="12" fill="#cccccc">}</text>

  <!-- Highlight box showing duplication -->
  <rect x="45" y="60" width="300" height="105" fill="none" stroke="#ffa500" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>

  <!-- Agent indicator -->
  <rect x="480" y="50" width="180" height="80" rx="8" fill="#2d2d30" stroke="#3b82f6" stroke-width="2"/>
  <text x="495" y="75" font-family="sans-serif" font-size="11" fill="#3b82f6" font-weight="bold">🤖 Agent Analyzing</text>
  <text x="495" y="95" font-family="sans-serif" font-size="10" fill="#cccccc">Found 15 duplicate</text>
  <text x="495" y="110" font-family="sans-serif" font-size="10" fill="#cccccc">code patterns</text>

