  <circle cx="660" cy="15" r="4" fill="#ff5f56"/>
  <circle cx="672" cy="15" r="4" fill="#ffbd2e"/>

  <!-- Line numbers -->
  <rect x="0" y="30" width="40" height="355" fill="#252526"/>
  <text x="10" y="55" font-family="monospace" font-size="11" fill="#858585">1</text>
  <text x="10" y="70" font-family="monospace" font-size="11" fill="#858585">2</text>
  <text x="10" y="85" font-family="monospace" font-size="11" fill="#858585">3</text>
  <text x="10" y="100" font-family="monospace" font-size="11" fill="#858585">4</text>
  <text x="10" y="115" font-family="monospace" font-size="11" fill="#858585">5</text>
