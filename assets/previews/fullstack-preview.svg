<svg width="684" height="385" viewBox="0 0 684 385" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="684" height="385" fill="#1e1e1e"/>

  <!-- Split view - Database Schema (Left) -->
  <rect x="0" y="0" width="342" height="385" fill="#1e1e1e"/>
  <rect x="0" y="0" width="342" height="30" fill="#2d2d30"/>
  <text x="12" y="20" font-family="monospace" font-size="11" fill="#cccccc">schema.sql</text>

  <!-- Database schema code -->
  <text x="10" y="55" font-family="monospace" font-size="11" fill="#569cd6">CREATE TABLE</text>
  <text x="110" y="55" font-family="monospace" font-size="11" fill="#4ec9b0">users</text>
  <text x="160" y="55" font-family="monospace" font-size="11" fill="#cccccc">(</text>

  <text x="15" y="75" font-family="monospace" font-size="11" fill="#9cdcfe">id</text>
  <text x="50" y="75" font-family="monospace" font-size="11" fill="#4ec9b0">SERIAL</text>
  <text x="110" y="75" font-family="monospace" font-size="11" fill="#c586c0">PRIMARY KEY</text>
  <text x="210" y="75" font-family="monospace" font-size="11" fill="#cccccc">,</text>

  <text x="15" y="95" font-family="monospace" font-size="11" fill="#9cdcfe">email</text>
  <text x="70" y="95" font-family="monospace" font-size="11" fill="#4ec9b0">VARCHAR</text>
  <text x="135" y="95" font-family="monospace" font-size="11" fill="#cccccc">(255),</text>

  <text x="15" y="115" font-family="monospace" font-size="11" fill="#9cdcfe">created_at</text>
  <text x="105" y="115" font-family="monospace" font-size="11" fill="#4ec9b0">TIMESTAMP</text>

  <text x="10" y="135" font-family="monospace" font-size="11" fill="#cccccc">);</text>

  <!-- API Code (Right) -->
  <rect x="342" y="0" width="342" height="385" fill="#1e1e1e"/>
  <rect x="342" y="0" width="342" height="30" fill="#2d2d30"/>
  <text x="354" y="20" font-family="monospace" font-size="11" fill="#cccccc">routes/users.js</text>

  <!-- API route code -->
  <text x="352" y="55" font-family="monospace" font-size="11" fill="#c586c0">app</text>
  <text x="375" y="55" font-family="monospace" font-size="11" fill="#cccccc">.</text>
  <text x="382" y="55" font-family="monospace" font-size="11" fill="#dcdcaa">get</text>
  <text x="408" y="55" font-family="monospace" font-size="11" fill="#cccccc">(</text>
  <text x="415" y="55" font-family="monospace" font-size="11" fill="#ce9178">'/api/users'</text>
  <text x="495" y="55" font-family="monospace" font-size="11" fill="#cccccc">,</text>

  <text x="357" y="75" font-family="monospace" font-size="11" fill="#569cd6">async</text>
  <text x="400" y="75" font-family="monospace" font-size="11" fill="#cccccc">(req, res) => {</text>

  <text x="362" y="95" font-family="monospace" font-size="11" fill="#569cd6">const</text>
  <text x="405" y="95" font-family="monospace" font-size="11" fill="#9cdcfe">users</text>
  <text x="450" y="95" font-family="monospace" font-size="11" fill="#cccccc">=</text>
  <text x="465" y="95" font-family="monospace" font-size="11" fill="#c586c0">await</text>

  <text x="367" y="115" font-family="monospace" font-size="11" fill="#4ec9b0">User</text>
  <text x="397" y="115" font-family="monospace" font-size="11" fill="#cccccc">.</text>
  <text x="404" y="115" font-family="monospace" font-size="11" fill="#dcdcaa">findAll</text>
  <text x="458" y="115" font-family="monospace" font-size="11" fill="#cccccc">();</text>

  <text x="362" y="135" font-family="monospace" font-size="11" fill="#c586c0">res</text>
  <text x="380" y="135" font-family="monospace" font-size="11" fill="#cccccc">.</text>
  <text x="387" y="135" font-family="monospace" font-size="11" fill="#dcdcaa">json</text>
  <text x="413" y="135" font-family="monospace" font-size="11" fill="#cccccc">(users);</text>

  <text x="357" y="155" font-family="monospace" font-size="11" fill="#cccccc">});</text>

  <!-- Agent status -->
  <rect x="230" y="280" width="220" height="90" rx="8" fill="#2d2d30" stroke="#3b82f6" stroke-width="2"/>
  <text x="245" y="305" font-family="sans-serif" font-size="12" fill="#3b82f6" font-weight="bold">🤖 Building Full-Stack</text>
  <text x="245" y="330" font-family="sans-serif" font-size="10" fill="#cccccc">✓ Database schema</text>
  <text x="245" y="350" font-family="sans-serif" font-size="10" fill="#cccccc">✓ API endpoints</text>
  <text x="245" y="365" font-family="sans-serif" font-size="10" fill="#10b981">→ Creating frontend...</text>
</svg>
