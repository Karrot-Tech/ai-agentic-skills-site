  <text x="910" y="410" font-family="sans-serif" font-size="12" fill="#ff5f56" font-weight="bold">85%</text>
  <text x="815" y="435" font-family="sans-serif" font-size="11" fill="#cccccc">Both use null checks and</text>
  <text x="815" y="455" font-family="sans-serif" font-size="11" fill="#cccccc">early returns pattern</text>

