  <text x="390" y="155" font-family="monospace" font-size="11" fill="#6a9955">// helpers.js - Duplicate Pattern #1</text>

  <text x="390" y="180" font-family="monospace" font-size="12" fill="#569cd6">function</text>
  <text x="465" y="180" font-family="monospace" font-size="12" fill="#dcdcaa">validateEmail</text>
  <text x="575" y="180" font-family="monospace" font-size="12" fill="#cccccc">(email) {</text>

  <text x="400" y="205" font-family="monospace" font-size="12" fill="#c586c0">if</text>
  <text x="425" y="205" font-family="monospace" font-size="12" fill="#cccccc">(!email) {</text>
  <text x="400" y="230" font-family="monospace" font-size="12" fill="#c586c0">return</text>
  <text x="455" y="230" font-family="monospace" font-size="12" fill="#569cd6">false</text>
  <text x="495" y="230" font-family="monospace" font-size="12" fill="#cccccc">;</text>
  <text x="390" y="255" font-family="monospace" font-size="12" fill="#cccccc">}</text>
  <text x="400" y="280" font-family="monospace" font-size="12" fill="#c586c0">if</text>
  <text x="425" y="280" font-family="monospace" font-size="12" fill="#cccccc">(!email.includes(</text>
  <text x="575" y="280" font-family="monospace" font-size="12" fill="#ce9178">'@'</text>
  <text x="605" y="280" font-family="monospace" font-size="12" fill="#cccccc">)) {</text>
  <text x="400" y="305" font-family="monospace" font-size="12" fill="#c586c0">return</text>
  <text x="455" y="305" font-family="monospace" font-size="12" fill="#569cd6">false</text>
  <text x="495" y="305" font-family="monospace" font-size="12" fill="#cccccc">;</text>
  <text x="390" y="330" font-family="monospace" font-size="12" fill="#cccccc">}</text>
  <text x="400" y="355" font-family="monospace" font-size="12" fill="#c586c0">return</text>
  <text x="455" y="355" font-family="monospace" font-size="12" fill="#569cd6">true</text>
  <text x="495" y="355" font-family="monospace" font-size="12" fill="#cccccc">;</text>
  <text x="390" y="380" font-family="monospace" font-size="12" fill="#cccccc">}</text>

  <rect x="385" y="193" width="400" height="195" fill="none" stroke="#ffa500" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Bottom code block (similar pattern) -->
  <text x="390" y="420" font-family="monospace" font-size="11" fill="#6a9955">// validators.js - Duplicate Pattern #2</text>

  <text x="390" y="445" font-family="monospace" font-size="12" fill="#569cd6">function</text>
  <text x="465" y="445" font-family="monospace" font-size="12" fill="#dcdcaa">validateUsername</text>
  <text x="605" y="445" font-family="monospace" font-size="12" fill="#cccccc">(username) {</text>

  <text x="400" y="470" font-family="monospace" font-size="12" fill="#c586c0">if</text>
  <text x="425" y="470" font-family="monospace" font-size="12" fill="#cccccc">(!username) {</text>
  <text x="400" y="495" font-family="monospace" font-size="12" fill="#c586c0">return</text>
  <text x="455" y="495" font-family="monospace" font-size="12" fill="#569cd6">false</text>
  <text x="495" y="495" font-family="monospace" font-size="12" fill="#cccccc">;</text>
  <text x="390" y="520" font-family="monospace" font-size="12" fill="#cccccc">}</text>
  <text x="400" y="545" font-family="monospace" font-size="12" fill="#c586c0">if</text>
  <text x="425" y="545" font-family="monospace" font-size="12" fill="#cccccc">(username.length < 3) {</text>
  <text x="400" y="570" font-family="monospace" font-size="12" fill="#c586c0">return</text>
  <text x="455" y="570" font-family="monospace" font-size="12" fill="#569cd6">false</text>
  <text x="495" y="570" font-family="monospace" font-size="12" fill="#cccccc">;</text>
  <text x="390" y="595" font-family="monospace" font-size="12" fill="#cccccc">}</text>
  <text x="400" y="620" font-family="monospace" font-size="12" fill="#c586c0">return</text>
  <text x="455" y="620" font-family="monospace" font-size="12" fill="#569cd6">true</text>
  <text x="495" y="620" font-family="monospace" font-size="12" fill="#cccccc">;</text>

  <rect x="385" y="458" width="400" height="175" fill="none" stroke="#ffa500" stroke-width="2" stroke-dasharray="5,5"/>

